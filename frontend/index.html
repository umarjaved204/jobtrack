<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JobTrack: track job applications, pipeline analytics and resume match scores."
    />
    <!-- Browser UI colour = page paper. Set from the *chosen* theme by the script below
         and by src/lib/theme.ts (not from the OS), so it matches the app. -->
    <meta name="theme-color" content="#f3ede2" />
    <title>JobTrack</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Preload the one font file the landing headline (the LCP element) needs, so it isn't
      discovered only after the CSS loads. Vite rewrites this node_modules path to the same
      hashed asset the Fontsource CSS references. crossorigin is required for font preloads.
    -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Apply the saved theme + accent before first paint so there is no light/dark flash.
      Storage keys and the accent pattern must stay in sync with the app's theme code.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('jobtrack:theme') || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', dark ? '#12100e' : '#f3ede2');
          var accent = localStorage.getItem('jobtrack:accent');
          if (accent && /^[a-z][a-z-]{0,19}$/.test(accent)) root.dataset.accent = accent;
        } catch (e) {
          /* storage blocked: fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
