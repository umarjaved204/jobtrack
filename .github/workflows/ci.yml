# CI: lint, typecheck, test, build for backend and frontend (+ Storybook build since Phase 4).
# Expanded in Phase 11 (coverage, Playwright, Docker build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobtrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jobtrack:jobtrack@localhost:5432/jobtrack_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://jobtrack:jobtrack@localhost:5432/jobtrack
      # Coverage floor here, not in pyproject: there it would fail every partial local run.
      # 97% measured at the start of Phase 11; raise it as coverage grows.
      - run: uv run pytest --cov-fail-under=96

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest: design-token contrast checks, components (RTL + jsdom), app shell routing.
      # Fails under the coverage thresholds in vite.config.ts.
      - run: pnpm test:coverage
      - run: pnpm build
      # Fails the PR if any story no longer compiles.
      - run: pnpm build-storybook --quiet
