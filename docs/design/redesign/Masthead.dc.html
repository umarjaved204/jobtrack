<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobTrack — masthead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #16130F; background: #F3EDE2">
<div style="max-width: 1296px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px)">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D6CCBB">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #4A433A">MONDAY, NOVEMBER 23, 2026</p>
<div style="display: flex; align-items: center; gap: 8px">
<a href="Palette.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid #CFC4B2; background: #F8F4EC; color: #4A433A; text-decoration: none; font-size: 14px; min-width: 260px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex: 1">Search or jump to…</span>
<kbd style="font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 2px 6px; border: 1px solid #CFC4B2; background: #F3EDE2; color: #4A433A">⌘K</kbd>
</a>
<button type="button" aria-label="Switch to the night edition (dark theme)" style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0; color: #16130F; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</button>
<button type="button" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px; background: transparent; border: 0; cursor: pointer; font: 600 15px 'Instrument Sans', sans-serif; color: #16130F">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #C2361F; color: #FFF; display: grid; place-items: center; font-size: 13px; font-weight: 700">AJ</span>
Aqib Javed
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 18px 0 14px">
<a href="Main.dc.html" style="text-decoration: none; font-family: Fraunces, serif; font-weight: 600; font-size: 60px; line-height: 0.9; letter-spacing: -0.03em; color: #16130F">Job<span style="color: #E4412B">Track</span></a>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<p style="margin: 0; font-family: Fraunces, serif; font-style: italic; font-size: 21px; color: #2E2922">The job hunt, in print.</p>
<p style="margin: 0; font-size: 12px; letter-spacing: 0.14em; color: #4A433A">34 APPLICATIONS ON FILE</p>
</div>
</div>
<div aria-hidden="true" style="border-top: 3px solid #16130F; border-bottom: 1px solid #16130F; height: 2px"></div>

<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #D6CCBB">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
<li>
<sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}">
<a href="{{ n.href }}" aria-current="page" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; font-size: 16px; font-weight: 700; color: #16130F; text-decoration: none; box-shadow: inset 0 -3px 0 #E4412B">{{ n.label }}</a>
</sc-if>
<sc-if value="{{ n.off }}" hint-placeholder-val="{{ true }}">
<a href="{{ n.href }}" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; font-size: 16px; font-weight: 500; color: #4A433A; text-decoration: none">{{ n.label }}</a>
</sc-if>
</li>
</sc-for>
</ul>
<a href="Form.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; background: #C2361F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; margin: 6px 0">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
Add application
</a>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Dashboard","Applications","Calendar","Resumes","Match","Settings"],"default":"Dashboard"},"$preview":{"width":1440,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'Dashboard';
    var nav = [
      ['Dashboard', 'Main.dc.html'], ['Applications', 'Board.dc.html'], ['Calendar', 'Calendar.dc.html'],
      ['Resumes', 'Resumes.dc.html'], ['Match', 'Match.dc.html'], ['Settings', 'Settings.dc.html']
    ];
    return {
      items: nav.map(function (n) { return { label: n[0], href: n[1], on: n[0] === active, off: n[0] !== active }; })
    };
  }
}
</script>
</body>
</html>
