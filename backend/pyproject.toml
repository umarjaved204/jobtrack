[project]
name = "jobtrack-backend"
version = "0.1.0"
description = "JobTrack API: job application tracker backend (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "dnspython>=2.9.2",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    # Exact pin: a new version can change embeddings and so scores (ADR 0004).
    "fastembed==0.9.1",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.8",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# This is an application, not a library: don't build/install it as a package.
package = false

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "N",        # pep8-naming
  "C4",       # comprehensions
  "RUF",      # ruff-specific
  "S",        # bandit (security)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not model"`: tests that load the real embedding model are skipped by default (CI never
# downloads it). Run them with `uv run pytest -m model`; a later -m on the command line wins.
addopts = "-ra --strict-markers --cov --cov-report=term-missing:skip-covered -m 'not model'"
markers = [
  "model: loads a real embedding model (fastembed downloads ~70 MB on first run); skipped by default",
]
filterwarnings = [
  # Every warning fails the run: library deprecations (e.g. SQLAlchemy 2.0 -> 2.1) and
  # Pydantic serializer warnings surface immediately. Allow-list specific ones if needed.
  "error",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
