# Alembic config. The database URL is NOT set here: alembic/env.py reads it from
# app settings (DATABASE_URL env var), so there is a single source of truth.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# e.g. 2026_11_16_1200-3f2a9c1d_initial_schema.py: sorts chronologically in the file tree
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Format autogenerated migrations so they pass the same Ruff checks as the app.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
